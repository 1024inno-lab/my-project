AWSTemplateFormatVersion: "2010-09-09"
Description: >
  투자 데스크 — GitHub Actions 배포 권한 1회용 설정.
  AuthMode=oidc(권장): 액세스 키 없이 GitHub OIDC 역할로 배포.
  AuthMode=accesskey: OIDC 공급자 생성이 막힌 계정용. 배포 전용 IAM 사용자를 만들고, 액세스 키는 콘솔에서 발급.

Parameters:
  AuthMode:
    Type: String
    Default: oidc
    AllowedValues: [oidc, accesskey]
    Description: "oidc = 권장 / accesskey = OIDC 공급자 생성이 거부될 때"
  GitHubOwner:
    Type: String
    Default: 1024inno-lab
    Description: "GitHub 계정명 (예시 andrew)"
  GitHubRepo:
    Type: String
    Default: my-project
    Description: 저장소 이름
  AppStackName:
    Type: String
    Default: invest-desk
    Description: 앱 스택 이름 (deploy.yml과 같아야 함)
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: (oidc 모드) 이 계정에 GitHub OIDC 공급자가 이미 있으면 false

Conditions:
  UseOidc: !Equals [!Ref AuthMode, oidc]
  UseKey: !Equals [!Ref AuthMode, accesskey]
  MakeProvider: !And [!Condition UseOidc, !Equals [!Ref CreateOidcProvider, "true"]]

Resources:
  # 앱 스택이 만드는 Lambda·스케줄러 역할만 관리하도록 IAM 권한을 좁힌 정책 (두 모드 공통)
  ManageAppRolesPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppStackName}-manage-app-roles"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:PassRole
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
          - Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"

  # ---------- oidc 모드 ----------
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Condition: UseOidc
    Properties:
      RoleName: !Sub "${AppStackName}-github-deploy"
      Description: GitHub Actions deploy role (main branch only)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # 공급자를 먼저 만든 뒤 역할을 만들도록 직접 참조
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidc
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
        - !Ref ManageAppRolesPolicy

  # ---------- accesskey 모드 ----------
  DeployUser:
    Type: AWS::IAM::User
    Condition: UseKey
    Properties:
      UserName: !Sub "${AppStackName}-github-deployer"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
        - !Ref ManageAppRolesPolicy

Outputs:
  DeployRoleArn:
    Condition: UseOidc
    Description: GitHub 저장소 Settings > Variables에 AWS_DEPLOY_ROLE_ARN으로 등록
    Value: !GetAtt DeployRole.Arn
  DeployUserName:
    Condition: UseKey
    Description: IAM > 사용자 > 이 사용자 > 보안 자격 증명에서 액세스 키를 만들어 GitHub Secrets에 등록
    Value: !Ref DeployUser
