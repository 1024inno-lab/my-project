AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  투자 데스크 — 보유 자산 관리 + 실시간 시세 + 데일리 투자전략 (서버리스, 서울 리전)

Parameters:
  OwnerEmail:
    Type: String
    Description: 로그인 계정이자 데일리 전략 메일을 받을 이메일
    AllowedPattern: ".+@.+\\..+"
  ClaudeModel:
    Type: String
    Default: claude-sonnet-5-5
    Description: 전략 생성에 쓸 Claude 모델 ID
  WebSearchTool:
    Type: String
    Default: web_search_20250305
    Description: Claude API 웹 검색 도구 버전

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 30
    CodeUri: backend/src/
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        SECRET_ARN: !Ref AppSecret
        OWNER_EMAIL: !Ref OwnerEmail
        SENDER_EMAIL: !Ref OwnerEmail
        CLAUDE_MODEL: !Ref ClaudeModel
        WEB_SEARCH_TOOL: !Ref WebSearchTool
        SITE_URL: !Sub "https://${Distribution.DomainName}"

Resources:
  # ---------------- 데이터 ----------------
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  AppSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: "invest-desk API keys (KIS, Anthropic, data.go.kr) - fill in values in the console"
      SecretString: '{"KIS_APP_KEY":"CHANGE_ME","KIS_APP_SECRET":"CHANGE_ME","ANTHROPIC_API_KEY":"CHANGE_ME","DATA_GO_KR_KEY":"CHANGE_ME"}'

  # ---------------- 로그인 (본인 1명) ----------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      MfaConfiguration: "OPTIONAL"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireLowercase: true, RequireNumbers: true, RequireSymbols: false, RequireUppercase: false }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub "invest-desk-${AWS::AccountId}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub "https://${Distribution.DomainName}/", "http://localhost:8765/"]
      LogoutURLs: [!Sub "https://${Distribution.DomainName}/", "http://localhost:8765/"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 1
      AccessTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: hours, AccessToken: hours, RefreshToken: days }

  OwnerUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref OwnerEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - { Name: email, Value: !Ref OwnerEmail }
        - { Name: email_verified, Value: "true" }

  # ---------------- API ----------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
      CorsConfiguration:
        AllowOrigins: [!Sub "https://${Distribution.DomainName}", "http://localhost:8765"]
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      Description: 보유 종목·시세·채권 조회·전략 조회 API
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AppSecret }
      Events:
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/{proxy+}", Method: ANY }
        # 브라우저 CORS 사전 요청(OPTIONS)은 토큰 없이 오므로 인증 없이 통과시킨다
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/{proxy+}"
            Method: OPTIONS
            Auth: { Authorizer: NONE }

  # ---------------- 에이전트 (백엔드 전용) ----------------
  DailyAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: daily_agent.handler
      Description: 평일 07:30 요인 가중 채점 → 데일리 전략 생성·메일 발송
      Timeout: 900
      MemorySize: 1024
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AppSecret }
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: "*"
      Events:
        Weekday0730:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(30 7 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Seoul
            RetryPolicy: { MaximumRetryAttempts: 1 }

  ReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: review.handler
      Description: 평일 07:00 전일 판단 복기 → 요인 가중치 자동 조정
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - AWSSecretsManagerGetSecretValuePolicy: { SecretArn: !Ref AppSecret }
      Events:
        Weekday0700:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 7 ? * MON-FRI *)"
            ScheduleExpressionTimezone: Asia/Seoul
            RetryPolicy: { MaximumRetryAttempts: 1 }

  OwnerEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref OwnerEmail

  # ---------------- 웹페이지 (S3 + CloudFront) ----------------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 } }]

  SiteOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: invest-desk site
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOAC.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6        # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  SiteUrl:
    Description: 접속 주소
    Value: !Sub "https://${Distribution.DomainName}"
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CognitoDomain:
    Value: !Sub "https://invest-desk-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
  UserPoolClientId:
    Value: !Ref UserPoolClient
  SiteBucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SecretArn:
    Description: 이 Secret에 API 키 4개를 입력하세요
    Value: !Ref AppSecret
  DailyAgentFunctionName:
    Value: !Ref DailyAgentFunction
