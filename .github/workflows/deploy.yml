name: Deploy

# 자동 배포하지 않음 — 작업이 끝났을 때 Actions 탭에서 "Run workflow"로 직접 배포
on:
  workflow_dispatch:

permissions:
  id-token: write   # GitHub OIDC → AWS 역할 (액세스 키 저장 없음)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  STACK_NAME: invest-desk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest boto3 cfn-lint -r backend/src/requirements.txt
      - run: cd backend && pytest -q
      - run: cfn-lint template.yaml infra/bootstrap.yaml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.OWNER_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      # 권장: OIDC 역할 (Variables: AWS_DEPLOY_ROLE_ARN)
      - name: AWS 인증 (OIDC 역할)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # 대체: 배포 전용 IAM 사용자 액세스 키 (Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
      - name: AWS 인증 (액세스 키)
        if: ${{ vars.AWS_DEPLOY_ROLE_ARN == '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build backend
        run: sam build

      - name: Deploy stack
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "OwnerEmail=${{ vars.OWNER_EMAIL }}" ${{ vars.CLAUDE_MODEL && format('ClaudeModel={0}', vars.CLAUDE_MODEL) || '' }}

      - name: Read stack outputs
        id: out
        run: |
          get() { aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "api=$(get ApiUrl)" >> "$GITHUB_OUTPUT"
          echo "domain=$(get CognitoDomain)" >> "$GITHUB_OUTPUT"
          echo "client=$(get UserPoolClientId)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(get SiteBucketName)" >> "$GITHUB_OUTPUT"
          echo "dist=$(get DistributionId)" >> "$GITHUB_OUTPUT"
          echo "site=$(get SiteUrl)" >> "$GITHUB_OUTPUT"
          echo "secret=$(get SecretArn)" >> "$GITHUB_OUTPUT"

      # GitHub Secrets에 넣은 API 키를 AWS Secrets Manager로 옮긴다 (넣은 키만, 값은 로그에 노출되지 않음)
      - name: Sync API keys
        env:
          SECRET_ARN: ${{ steps.out.outputs.secret }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          current=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ARN" --query SecretString --output text)
          updated=$(CURRENT="$current" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["CURRENT"] or "{}")
          changed = []
          for k in ("KIS_APP_KEY", "KIS_APP_SECRET", "ANTHROPIC_API_KEY", "DATA_GO_KR_KEY"):
              v = os.environ.get(k, "").strip()
              if v and data.get(k) != v:
                  data[k] = v
                  changed.append(k)
          print(json.dumps({"secret": json.dumps(data), "changed": changed}))
          PY
          )
          changed=$(echo "$updated" | python3 -c "import json,sys; print(','.join(json.load(sys.stdin)['changed']))")
          if [ -z "$changed" ]; then echo "변경된 API 키 없음"; exit 0; fi
          echo "$updated" | python3 -c "import json,sys; print(json.load(sys.stdin)['secret'])" > /tmp/secret.json
          aws secretsmanager put-secret-value --secret-id "$SECRET_ARN" --secret-string file:///tmp/secret.json >/dev/null
          rm -f /tmp/secret.json
          echo "API 키 갱신: $changed"
          echo "API 키 갱신: $changed" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish frontend
        run: |
          cat > frontend/config.js <<EOF
          window.APP_CONFIG = { apiUrl: "${{ steps.out.outputs.api }}", cognitoDomain: "${{ steps.out.outputs.domain }}", clientId: "${{ steps.out.outputs.client }}", demo: false };
          EOF
          aws s3 sync frontend "s3://${{ steps.out.outputs.bucket }}" --delete --exclude "config.example.js" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ steps.out.outputs.dist }}" --paths "/*" >/dev/null

      - name: Summary
        run: |
          echo "### 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "접속 주소: ${{ steps.out.outputs.site }}" >> "$GITHUB_STEP_SUMMARY"
